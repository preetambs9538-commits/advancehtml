<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Page</title>
    <style>
        /* Basic page styling */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 200px;
            background-color: #f4f4f9;
            color: #333;
        }

        /* About Me section card */
        .about-section {
            background: #ffffff;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Profile image placeholder */
        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        /* Heading style */
        .about-section h1 {
            margin: 10px 0 5px;
            color: #2c3e50;
        }

        /* Subtitle style */
        .title {
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 15px;
        }

        /* Social media links */
        .social-links a {
            display: inline-block;
            margin: 10px 8px;
            padding: 8px 16px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.3s;
        }

        .social-links a:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <!-- Main Content Wrapper -->
    <main>
        
        <!-- About Me Section -->
        <section class="about-section">
            <!-- Replace the src with your actual image URL or local path -->
            <img src="https://placeholder.com" alt="Your Profile Picture" class="profile-img">
            
            <h1>Your Name</h1>
            <p class="title">Web Developer & Designer</p>
            
            <p>
                Hi there! Welcome to my profile. I love building clean, functional, 
                and accessible websites. In my free time, I enjoy learning new web 
                technologies, writing tutorials, and contributing to open-source projects.
            </p>
            
            <!-- Add Me / Connect Section Links -->
            <div class="social-links">
                <a href="https://linkedin.com" target="_blank">Add on LinkedIn</a>
                <a href="https://github.com" target="_blank">Follow on GitHub</a>
                <a href="mailto:your.email@example.com">Email Me</a>
            </div>
        </section>

    </main>

</body>
</html>
